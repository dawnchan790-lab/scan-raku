# 帳票レイアウト定義（現行Excelの実際のセル位置）
#
# テンプレートには現行の数式が残してあるので、ここで指定するのは
# 「これまで人が入力していた値」だけ。金額・合計・消費税はExcelの数式が計算する。
# 数式が入っている列（納品書のF・G列、請求書のN列）はここに書かないこと。

delivery_note:
  sheet: 納品書
  cells:
    store_name: C8            # 「仙台高野原店　様」
    delivery_date: C2
    shipping_label: B71       # 送料行の品名
    shipping_cost: D71        # 送料の原価。空欄なら数量・金額の数式も空欄になる
  rows:
    start: 14
    count: 57                 # 14〜70行
    columns:
      line_no: A          # 連番。YAMLでは no: が真偽値になるため line_no にしている
      item_name: B
      retail_price: C         # 単価（売価）
      cost_price: D           # 単価（原価）
      qty: E
      # F列=金額(売価)、G列=金額(原価) はテンプレートの数式に任せる
  overflow: new_sheet

invoice:
  sheet: 請求書
  cells:
    store_name: B6            # 「ファミリーマート　仙台高野原店」
    issue_date: O4
    number: O6
    payment_due: C17
  rows:
    start: 21
    count: 26                 # 21〜46行
    columns:
      sale_date: B
      item_name: D
      reduced_mark: K         # 「※」= 軽減税率8%対象。集計式がこの印を拾う
      qty: L
      unit: M
      amount: O               # 金額（税込）
      # N列=税率 はテンプレートの数式に任せる
  # 明細が26行に収まらない場合、集計式の範囲とずれて請求額が狂うため、
  # 黙って2ページに分けずエラーで止める
  overflow: error
